<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1400 520"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">
    Graph-Link imitation-learning architecture
  </title>

  <desc id="description">
    State observations pass through per-link encoders and child-to-parent
    dynamics message passing. Root or all-node features condition a diffusion
    policy that produces an action sequence.
  </desc>

  <defs>
    <linearGradient id="blueGradient" x1="0" x2="1">
      <stop offset="0" stop-color="#3273dc"/>
      <stop offset="1" stop-color="#4a91ef"/>
    </linearGradient>
    <linearGradient id="greenGradient" x1="0" x2="1">
      <stop offset="0" stop-color="#1f9d68"/>
      <stop offset="1" stop-color="#45bd88"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12z" fill="#777777"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1400" height="520" rx="18" fill="#f8f9fb"/>
  <text x="700" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#222222">Dynamics-informed conditioning for diffusion policy</text>

  <g filter="url(#shadow)">
    <rect x="45" y="174" width="190" height="170" rx="16" fill="#ffffff" stroke="#d8d8d8" stroke-width="2"/>
    <text x="140" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#222222">State history</text>
    <text x="140" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666666">Two observations</text>
    <path d="M92 287h96M92 307h72M92 267h82" fill="none" stroke="#3273dc" stroke-linecap="round" stroke-width="8"/>
  </g>
  <path d="M235 259h70" fill="none" stroke="#777777" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="315" y="126" width="220" height="266" rx="16" fill="#ffffff" stroke="#91bbee" stroke-width="2"/>
    <text x="425" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#245ea8">Φ</text>
    <text x="425" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#222222">Link-wise encoding</text>
    <g fill="#eaf3ff" stroke="#3273dc" stroke-width="2"><rect x="350" y="220" width="150" height="34" rx="8"/><rect x="350" y="266" width="150" height="34" rx="8"/><rect x="350" y="312" width="150" height="34" rx="8"/></g>
    <g text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#245ea8"><text x="425" y="242">Link encoder 1</text><text x="425" y="288">Link encoder 2</text><text x="425" y="334">Link encoder K</text></g>
  </g>
  <path d="M535 259h62" fill="none" stroke="#777777" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="608" y="96" width="260" height="326" rx="16" fill="#ffffff" stroke="#82cdaa" stroke-width="2"/>
    <text x="738" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#167d4f">M</text>
    <text x="738" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#222222">Dynamics message passing</text>
    <text x="738" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#666666">Child-to-parent propagation</text>
    <g fill="none" stroke="#1f9d68" stroke-width="3" marker-end="url(#arrow)"><path d="M670 346 705 300"/><path d="M806 346 770 300"/><path d="M705 283 738 237"/><path d="M770 283 738 237"/></g>
    <g fill="url(#greenGradient)" stroke="#ffffff" stroke-width="3"><circle cx="670" cy="355" r="19"/><circle cx="806" cy="355" r="19"/><circle cx="705" cy="292" r="19"/><circle cx="770" cy="292" r="19"/><circle cx="738" cy="226" r="23"/></g>
    <text x="738" y="399" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#167d4f">Learnable inertia and motion bases</text>
  </g>
  <path d="M868 259h60" fill="none" stroke="#777777" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="940" y="145" width="190" height="228" rx="16" fill="#ffffff" stroke="#d8d8d8" stroke-width="2"/>
    <text x="1035" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222222">ABD condition</text>
    <rect x="972" y="211" width="126" height="48" rx="9" fill="#eaf3ff" stroke="#3273dc" stroke-width="2"/>
    <text x="1035" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#245ea8">Root feature</text>
    <text x="1035" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#777777">or</text>
    <rect x="972" y="303" width="126" height="48" rx="9" fill="#eaf8f1" stroke="#1f9d68" stroke-width="2"/>
    <text x="1035" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#167d4f">All links</text>
  </g>
  <path d="M1130 259h55" fill="none" stroke="#777777" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1197" y="145" width="160" height="228" rx="16" fill="#ffffff" stroke="#a9a0e9" stroke-width="2"/>
    <text x="1277" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222222">Diffusion policy</text>
    <path d="M1234 229c24-26 61-26 86 0s25 61 0 86-62 26-86 0-25-60 0-86z" fill="none" stroke="#7167c7" stroke-width="4" stroke-dasharray="9 7"/>
    <path d="m1299 219 23 8-8 23" fill="none" stroke="#7167c7" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
    <text x="1277" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#665cae">Denoise actions</text>
  </g>
  <text x="700" y="477" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#666666">Raw robot state is preserved and augmented with the learned ABD representation.</text>
</svg>
